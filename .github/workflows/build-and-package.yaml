name: Build, Test and Package

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "37 1 * * *"

env:
  REGISTRY: ghcr.io

jobs:
  cypress-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up environment variables
        run: |
          source .env.cypress
          echo "INSTRUMENT_BUILD=$INSTRUMENT_BUILD" >> ${GITHUB_ENV}
          echo "VITE_ENV_NAME=$VITE_ENV_NAME" >> ${GITHUB_ENV}
          echo "VITE_GREDOR_BACKEND_BASEURL=$VITE_GREDOR_BACKEND_BASEURL" >> ${GITHUB_ENV}
          echo "VITE_IS_CYPRESS=$VITE_IS_CYPRESS" >> ${GITHUB_ENV}
          echo "VITE_TEST_MODE=$VITE_TEST_MODE" >> ${GITHUB_ENV}

      - name: Build for Cypress
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 #v7.4.1
        with:
          # Disable running of tests within build job
          runTests: false
          build: npm run build

      - name: Save build folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-build
          path: dist
          if-no-files-found: error

  cypress-run:
    runs-on: ${{ matrix.os }}
    needs: cypress-build
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        browser: [ chrome, edge, firefox ]
        browser-variant: [ stable, beta ]
        exclude:
          - os: windows-latest
            browser: edge
          - os: macos-latest
            browser: chrome
          - os: macos-latest
            browser: edge

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # För bättre SonarQube-analyser

      - name: Download build folder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cypress-build
          path: dist

      - name: Setup Chrome
        id: setup-chrome
        if: ${{ matrix.browser == 'chrome' }}
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: ${{ matrix.browser-variant }}

      - name: Setup Edge
        id: setup-edge
        if: ${{ matrix.browser == 'edge' }}
        uses: browser-actions/setup-edge@e2f31d5d9f2e6d75e72516221b4df8528e6325cf # v1.1.2
        with:
          edge-version: ${{ matrix.browser-variant }}

      - name: Setup Firefox
        id: setup-firefox
        if: ${{ matrix.browser == 'firefox' }}
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: ${{ matrix.browser-variant == 'beta' && 'latest-beta' || 'latest' }}

      - name: Run Cypress tests
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
        with:
          start: npm run preview
          browser: ${{ matrix.browser == 'chrome' && steps.setup-chrome.outputs.chrome-path || matrix.browser == 'edge' && steps.setup-edge.outputs.edge-path || steps.setup-firefox.outputs.firefox-path }}

      - name: SonarQube Scan
        if: ${{ matrix.browser == 'chrome' && matrix.browser-variant == 'stable' && matrix.os == 'ubuntu-latest' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload test screenshots on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cypress-screenshots_${{ matrix.os }}_${{ matrix.browser }}_${{ matrix.browser-variant }}
          path: cypress/screenshots
          if-no-files-found: warn

      - name: Upload test videos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cypress-videos_${{ matrix.os }}_${{ matrix.browser }}_${{ matrix.browser-variant }}
          path: cypress/videos
          if-no-files-found: warn

  build-and-package:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs: cypress-run

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN  }}

      - name: Get image ref
        run: |
          IMAGE_REF=${REGISTRY}/${GITHUB_REPOSITORY@L}
          echo "IMAGE_REF=$IMAGE_REF" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Get Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REF }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
